name: CI

on:
  - push

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3]
        composer-flags: ['', '--prefer-lowest']
        drupal-constraint: ['~11.1.10', '~11.2.14', '~11.3.18', '~11.4.9']

    steps:
      - uses: actions/checkout@v4

      - name: DDEV - Setup
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: DDEV - Configure and start
        run: |
          set -x
          ddev config --php-version=${{ matrix.php }}
          ddev start
          ddev php --version

      - name: Composer
        run: |
          set -x
          ddev composer update \
            --no-install ${{ matrix.composer-flags }} \
            --with drupal/core-recommended:${{ matrix.drupal-constraint }} \
            --with drupal/core-composer-scaffold:${{ matrix.drupal-constraint }} \
            --with drupal/core-dev:${{ matrix.drupal-constraint }}
          ddev composer install --prefer-dist --no-interaction

      - name: PhpStan
        run: ddev exec ./scripts/phpstan-all.sh

      - name: PhpUnit
        run: |
          set -x
          ddev exec ./vendor/bin/phpunit \
            --fail-on-incomplete \
            --fail-on-warning \
            --fail-on-skipped \
            --fail-on-risky
