name: CI - Packages

# Called from ci.yaml.
on:
  workflow_call:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        package:
          # Packages without tests are commented out.
          - adaptism
          - class-discovery
          - class-files-iterator
          - codegen-tools
          - dependency-injection
          # - di-discovery
          - drupal-testing
          # - egg
          - helpers
          - object-construction-kit
          - reflection
          - reflector-aware-attributes
          - testing
        php: [8.3, 8.4, 8.5]

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # @todo Review which extensions are needed.
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd
          coverage: pcov

      - name: Add repositories for monorepo packages
        run: |
          set -x
          php --version
          composer config --merge --json repositories.0 '{"type": "path", "url": "../*", "options": {"versions": {"*": "self.version"}}}'

      # Use 'update', because 'install' would report the missing
      # composer.lock file.
      - run: composer update --no-interaction

      # Packages with Drupal functional tests install a Drupal codebase into
      # web/, see their composer.json and phpunit.xml.dist.
      # Use absolute paths: With a relative path for the router script, some
      # requests fail to load it.
      - name: Start web server, if needed
        run: |
          set -x
          if [ -f web/.ht.router.php ]; then
            mkdir -p web/sites/default/files
            PHP_CLI_SERVER_WORKERS=4 nohup php -S 127.0.0.1:8888 -t "$PWD/web" "$PWD/web/.ht.router.php" > "$RUNNER_TEMP/web-server.log" 2>&1 &
          fi

      - name: PhpStan
        run: |
          set -x
          if [ -f phpstan.neon ]; then
            cp composer.json composer.json.bak
            cp composer.lock composer.lock.bak
            # Install phpstan packages that are required by drupal/core-dev.
            # This is needed so that phpstan has the same result if it is run
            # from the top level.
            # The top level composer.json also installs mglaman/phpstan-drupal
            # via drupal/core-dev, but it is disabled as a phpstan extension,
            # see `extra.phpstan/extension-installer` in the root
            # composer.json.
            composer config --no-plugins allow-plugins.phpstan/extension-installer true
            composer require --dev phpstan/phpstan phpstan/extension-installer phpstan/phpstan-deprecation-rules phpstan/phpstan-phpunit
            rm composer.json composer.lock
            mv composer.json.bak composer.json
            mv composer.lock.bak composer.lock
            ./vendor/bin/phpstan -v
            # Restore vendor/ to the state in composer.lock.
            # Don't use 'composer remove --dev phpstan/phpstan', which fails
            # if phpstan is also required by another package.
            composer install --no-interaction
          fi

      - run: vendor/bin/phpunit

      - name: Show web server log
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/web-server.log" ]; then
            tail -n 100 "$RUNNER_TEMP/web-server.log"
          fi

      - name: Enforce PHPUnit code coverage
        run: |
          set -x
          if [ ! -f .coverage ] || [ ! -f build/logs/clover.xml ]; then
            exit 0
          fi
          expected=$(head -n 1 .coverage)
          line=$(grep -o '<metrics[^>]*>' build/logs/clover.xml | tail -1)
          total=$(echo "$line" | sed -n 's/.* statements="\([0-9]*\)".*/\1/p')
          covered=$(echo "$line" | sed -n 's/.* coveredstatements="\([0-9]*\)".*/\1/p')
          percentage=$(echo "$covered / $total * 100" | bc -l)
          if [ $(echo "$covered * 100 < $expected * $total" | bc) -eq 1  ]; then
            cat build/logs/clover.xml
            echo "Fail: Expected at least $expected% coverage, found $percentage% coverage."
            exit 1
          fi
          echo "Pass: Expected at least $expected% coverage, found $percentage% coverage."
